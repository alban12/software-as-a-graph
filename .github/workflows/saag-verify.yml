name: SaaG Architectural Verification & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architectural-linter:
    name: Verify Clean Architecture & Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Full Test Suite
        run: |
          npm run test:canvas
          npm run test:mcp

      - name: Build Canvas UI Production Bundle
        run: npm run canvas:build

      - name: Verify Architecture across all Domain Graphs
        run: |
          echo "## 🛡️ SaaG Architectural CI/CD Verification Summary" > saag-report.md
          echo "" >> saag-report.md
          node packages/mcp-server/bin/saag-mcp.js verify --all --markdown >> saag-report.md
          cat saag-report.md >> $GITHUB_STEP_SUMMARY
          cat saag-report.md

      - name: Post Architectural Report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('saag-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
